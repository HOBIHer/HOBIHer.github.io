name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://gpaykyxwmouwadgmfnil.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_VNfyswX-5YqFzyG7lMlTBQ_fF8yM4Hz' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://gpaykyxwmouwadgmfnil.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_VNfyswX-5YqFzyG7lMlTBQ_fF8yM4Hz' }}
      VITE_WATER_SUPABASE_URL: ${{ vars.VITE_WATER_SUPABASE_URL || 'https://ilhdespamsutecfabknr.supabase.co' }}
      VITE_WATER_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_WATER_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_WATER_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_FX9v8Blw4wpIzLYA4hbzaQ_-FAs4dUc' }}
      VITE_WATER_USER_API_FUNCTION: ${{ vars.VITE_WATER_USER_API_FUNCTION || 'water-rewards-api' }}
      VITE_WATER_ADMIN_FUNCTION: ${{ vars.VITE_WATER_ADMIN_FUNCTION || 'water-rewards-admin' }}
      VITE_WATER_USER_MOCK: ${{ vars.VITE_WATER_USER_MOCK || 'false' }}
      VITE_WATER_ADMIN_MOCK: ${{ vars.VITE_WATER_ADMIN_MOCK || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Verify water pages production mode
        run: |
          if [ "$VITE_WATER_USER_MOCK" != "false" ] || [ "$VITE_WATER_ADMIN_MOCK" != "false" ]; then
            echo "VITE_WATER_USER_MOCK and VITE_WATER_ADMIN_MOCK must both be false for GitHub Pages deployment."
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
